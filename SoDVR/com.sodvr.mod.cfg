## Settings file was created by plugin SoDVR v0.1.0
## Plugin GUID: com.sodvr.mod

[Controls]

## Draw a pointer line from the main hand into the world.
# Setting type: Boolean
# Default value: false
WorldLaser = false

## The right hand points, interacts and holds items (false: the left). A trigger press on the other hand swaps.
# Setting type: Boolean
# Default value: true
MainHandRight = true

[HUD]

## How far in front of the eyes the HUD sits, in metres. Only changes its depth: the HUD looks the same size at any distance.
# Setting type: Single
# Default value: 2.5
Distance = 2.5

## HUD size: 1 spans about 60 degrees of view, 0.75 is smaller, 1.25 larger.
# Setting type: Single
# Default value: 1
Size = 1

## Height of the HUD's centre relative to the eyes, in metres (negative is lower).
# Setting type: Single
# Default value: -0.15
VerticalOffset = -0.15

[Movement]

## Walking speed in metres per second at full stick.
# Setting type: Single
# Default value: 4
MoveSpeed = 4

## How much faster sprinting (left stick click) is than walking.
# Setting type: Single
# Default value: 1.8
SprintMultiplier = 1.8

## Upward speed of a jump in metres per second.
# Setting type: Single
# Default value: 5
JumpSpeed = 5

## Downward acceleration in metres per second squared.
# Setting type: Single
# Default value: 15
Gravity = 15

[Rendering]

## Show the headset's view (the left eye) on the monitor.
# Setting type: Boolean
# Default value: true
MonitorMirror = true

## Forces HDRP DepthOfField off on every Volume. Temporary dev workaround: legacy WorldSpace canvases (e.g. the case board) are still blurred by the scene's depth of field until they move to RT panels — set false to restore normal depth of field.
# Setting type: Boolean
# Default value: true
ForceDisableDepthOfField = false

## Eye resolution as a fraction of what the headset asks for (1 = full; above 1 supersamples). Higher is sharper, panel edges included, and costs more GPU. Applies on the next launch.
# Setting type: Single
# Default value: 0.7
RenderScale = 0.7

[Turning]

## Turn smoothly with the right stick instead of in snaps.
# Setting type: Boolean
# Default value: false
SmoothTurn = false

## Degrees per snap turn.
# Setting type: Single
# Default value: 30
SnapTurnAngle = 30

## Degrees per second of smooth turning at full stick.
# Setting type: Single
# Default value: 120
SmoothTurnSpeed = 120

[VoidRoom]

## Show a minimal reference room instead of a blank frame while there is no game camera (press-any-key screen, loading, early startup). Costs almost nothing since the eye cameras are masked to the room's own layer.
# Setting type: Boolean
# Default value: true
Enabled = true

## Keep the void room up through the main menu too, instead of only the pre-game screens. The main menu's real backdrop is the game's skybox, which costs more and runs worse in a headset than the room it replaces — same menu panel, same position, only what's behind it changes.
# Setting type: Boolean
# Default value: true
ShowOnMainMenu = true

[Windows]

## How far in front of the head menus and windows open, in metres.
# Setting type: Single
# Default value: 1.5
MenuDistance = 1.5

